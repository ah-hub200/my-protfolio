<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔒 Top Secret Website</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b0f14; color:#39ff14; font-family:"Courier New",monospace; text-align:center; overflow:hidden; }
  .box { width:min(92vw,520px); padding:28px; border:2px solid #39ff14; border-radius:12px;
         box-shadow:0 0 24px #39ff1466; background:#0b0f14; position:relative; z-index:2; }
  h1 { font-size:1.5rem; margin:0 0 6px; }
  .sub { color:#8aff7a; font-size:.85rem; margin-bottom:18px; }
  #q { font-size:1.15rem; min-height:56px; margin:14px 0; color:#fff; }
  input { width:100%; padding:12px; font:inherit; background:#000; color:#39ff14;
          border:1px solid #39ff14; border-radius:6px; text-align:center; }
  button { margin-top:14px; padding:12px 22px; font:inherit; font-weight:bold; cursor:pointer;
           background:#39ff14; color:#000; border:0; border-radius:6px; }
  #msg { margin-top:14px; min-height:24px; color:#ff4d4d; }
  #bar { height:10px; background:#12301a; border-radius:5px; overflow:hidden; margin-top:16px; display:none; }
  #fill { height:100%; width:0; background:#39ff14; transition:width .3s; }
  #runner { position:fixed; padding:10px 16px; background:#ff4d4d; color:#fff; border:0; border-radius:6px;
            font:inherit; display:none; z-index:3; }
  .big { font-size:2.2rem; color:#fff; }
  canvas { position:fixed; inset:0; z-index:1; opacity:.25; }
</style>
</head>
<body>
<canvas id="rain"></canvas>

<div class="box" id="box">
  <h1>🔒 ACCESS DENIED</h1>
  <div class="sub">Answer the security questions to enter.</div>
  <div id="q"></div>
  <input id="a" placeholder="Type your answer..." autocomplete="off">
  <div><button id="go">Submit</button></div>
  <div id="msg"></div>
  <div id="bar"><div id="fill"></div></div>
</div>

<button id="runner">Skip questions</button>

<script>
const questions = [
  { q: "What is 2 + 2 ?", r: a => a.trim()==="4" ? "Correct... but are you SURE? Try again." : "Wrong. Obviously. Try again." },
  { q: "What is your mother's maiden name's favorite color?", r: () => "Suspicious. Very suspicious. Next." },
  { q: "How many legs does a normal Wi-Fi router have?", r: () => "The FBI has been notified. Next." },
  { q: "Are you a robot? (Be honest)", r: a => /yes|oui|ايه|نعم/i.test(a) ? "Honest robot detected. Respect. Next." : "That is exactly what a robot would say. Next." },
  { q: "Which is better: tabs or spaces?", r: () => "Both wrong. The correct answer is Vim. Next." }
];
let i = 0, tries = 0;
const $ = id => document.getElementById(id);
const showQ = () => { $("q").textContent = `Question ${i+1}/${questions.length}: ${questions[i].q}`; $("a").value=""; $("a").focus(); };

function submit() {
  const a = $("a").value;
  if (!a.trim()) { $("msg").textContent = "Empty answer? Bold strategy."; return; }
  if (a.trim().toLowerCase().replace(/\s+/g, "") === "yourmom") {
    $("msg").style.color = "#39ff14";
    $("msg").textContent = "Secret code accepted... loading portfolio 😎";
    setTimeout(() => { location.href = "portfolio.html"; }, 1200);
    return;
  }
  $("msg").textContent = questions[i].r(a);
  tries++;
  if (tries % 2 === 0) { i++; tries = 0; if (i >= questions.length) return finish(); showQ(); }
  else { $("a").value=""; }
}

function finish() {
  $("q").textContent = ""; $("a").style.display="none"; $("go").style.display="none";
  $("msg").style.color="#39ff14"; $("msg").textContent = "Analyzing your answers...";
  $("bar").style.display="block";
  let p = 0;
  const t = setInterval(() => {
    p += Math.random()*18; if (p>99) p=99; $("fill").style.width = p+"%";
    if (p>=99) { clearInterval(t); setTimeout(reveal, 900); }
  }, 350);
}

function reveal() {
  $("box").innerHTML = '<div class="big">🎉 ACCESS GRANTED 🎉</div>' +
    '<p>...just kidding.</p><p>There is nothing here.</p><p>You just answered 10 questions for nothing. 😎</p>' +
    '<button onclick="location.reload()">Try again</button>';
  $("runner").style.display = "none";
}

$("go").onclick = submit;
$("a").addEventListener("keydown", e => { if (e.key==="Enter") submit(); });

// The "Skip" button runs away from your mouse / finger
const r = $("runner"); r.style.display = "block";
function jump() {
  r.style.left = Math.random()*(innerWidth-r.offsetWidth-10) + "px";
  r.style.top  = Math.random()*(innerHeight-r.offsetHeight-10) + "px";
}
jump();
["mouseover","touchstart","click"].forEach(ev => r.addEventListener(ev, e => { e.preventDefault(); jump(); }));

// Matrix rain background
const c = $("rain"), x = c.getContext("2d");
function size(){ c.width=innerWidth; c.height=innerHeight; }
size(); addEventListener("resize", size);
const cols = () => Math.floor(c.width/16);
let drops = Array(cols()).fill(1);
setInterval(() => {
  x.fillStyle="rgba(11,15,20,.12)"; x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#39ff14"; x.font="16px monospace";
  if (drops.length!==cols()) drops = Array(cols()).fill(1);
  drops.forEach((y,k) => {
    x.fillText(String.fromCharCode(0x30A0+Math.random()*96), k*16, y*16);
    drops[k] = (y*16>c.height && Math.random()>.975) ? 0 : y+1;
  });
}, 50);

showQ();
</script>
</body>
</html>
